<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>网事1999 · 中国互联网编年史</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/NetEra-1999/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const GAME_W = 1440;
        const GAME_H = 900;

        const updateGameScale = () => {
          const scale = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
          document.documentElement.style.setProperty('--game-scale', String(Math.max(scale, 0.1)));
        };
        updateGameScale();
        window.addEventListener('resize', updateGameScale);
        window.addEventListener('orientationchange', updateGameScale);

        const enterLandscapeGame = async () => {
          try {
            if (document.fullscreenEnabled && !document.fullscreenElement) {
              await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
            }
          } catch (_) {}
          try {
            if (screen.orientation?.lock) await screen.orientation.lock('landscape');
          } catch (_) {}
          updateGameScale();
        };

        document.addEventListener('click', (event) => {
          const button = event.target?.closest?.('button');
          if (!button) return;
          const text = button.textContent || '';
          if (text.includes('穿越开局') || text.includes('读取上次存档')) {
            void enterLandscapeGame();
          }
        }, true);
      })();
    </script>
  </body>
</html>
